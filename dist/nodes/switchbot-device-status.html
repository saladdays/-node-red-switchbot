<!-- SwitchBot Device Status Node UI -->
<!-- Progressive Disclosure パターン -->

<script type="text/html" data-template-name="switchbot-device-status">
    <!-- ❶ 基本設定 -->
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> 名前</label>
        <input type="text" id="node-input-name" placeholder="任意の名前">
    </div>

    <div class="form-row">
        <label for="node-input-account"><i class="fa fa-key"></i> 認証</label>
        <input type="text" id="node-input-account">
    </div>

    <hr>

    <!-- ❷ デバイス選択 -->
    <div class="form-row">
        <label><i class="fa fa-microchip"></i> デバイス</label>
        <div style="display: inline-flex; align-items: center; width: 70%;">
            <button type="button" id="switchbot-status-refresh" class="red-ui-button" 
                    style="padding: 4px 8px; margin-right: 6px;" title="デバイス一覧を更新">
                <i class="fa fa-refresh"></i>
            </button>
            <select id="switchbot-status-device-select" style="flex: 1;">
                <option value="">(認証設定後、🔄で取得)</option>
            </select>
        </div>
    </div>

    <!-- デバイス情報（選択後に表示） -->
    <div class="form-row" id="switchbot-status-device-info" style="display: none;">
        <label></label>
        <span style="color: #666; font-size: 11px;">
            <i class="fa fa-info-circle"></i> 
            ID: <code id="switchbot-status-device-id-display">-</code>
            &nbsp;|&nbsp;
            Type: <code id="switchbot-status-device-type-display">-</code>
        </span>
    </div>

    <!-- ステータスメッセージ -->
    <div class="form-row" id="switchbot-status-message-row" style="display: none;">
        <label></label>
        <span id="switchbot-status-message" style="font-size: 12px;"></span>
    </div>

    <!-- 隠しフィールド -->
    <input type="hidden" id="node-input-deviceId">
    <input type="hidden" id="node-input-deviceType">
    <input type="hidden" id="node-input-deviceName">
</script>

<script type="text/html" data-help-name="switchbot-device-status">
    <p>SwitchBotデバイスのステータスを取得するノード。</p>

    <h3>使い方</h3>
    <ol>
        <li>認証情報（SwitchBot API）を設定</li>
        <li>🔄ボタンでデバイス一覧を取得</li>
        <li>デバイスを選択</li>
        <li>Injectノード等からトリガー</li>
    </ol>

    <h3>対応デバイス</h3>
    <ul>
        <li>Presence Sensor / Motion Sensor（detected, lightLevel）</li>
        <li>CO2センサー / 温湿度計（co2, temperature, humidity）</li>
        <li>カーテン（calibrate, moving, slidePosition）</li>
        <li>ロボット掃除機（workingStatus, onlineStatus）</li>
        <li>プラグ（power, voltage, electricCurrent）</li>
    </ul>

    <h3>出力</h3>
    <p>デバイスタイプに応じた固有フィールドのみ出力されます。</p>
    <p><code>raw</code>フィールドにはAPIレスポンス全体が含まれます。</p>
</script>

<script type="text/javascript">
(function() {
    RED.nodes.registerType('switchbot-device-status', {
        category: 'SwitchBot Custom',
        color: '#87CEEB',
        defaults: {
            name: { value: '' },
            account: { value: '', type: 'switchbot-credentials' },
            deviceId: { value: '' },
            deviceType: { value: '' },
            deviceName: { value: '' }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-thermometer-half',
        label: function () {
            // デバイス名があればそれを表示
            if (this.name) return this.name;
            if (this.deviceName) return this.deviceName;
            return 'SwitchBot Status';
        },
        paletteLabel: 'SwitchBot Status',
        oneditprepare: function () {
            var node = this;
            var deviceCache = [];

            var $deviceSelect = $('#switchbot-status-device-select');
            var $deviceInfo = $('#switchbot-status-device-info');
            var $messageRow = $('#switchbot-status-message-row');
            var $message = $('#switchbot-status-message');

            function showMessage(text, isError) {
                $message.text(text).css('color', isError ? '#c00' : '#080');
                $messageRow.show();
            }

            function hideMessage() {
                $messageRow.hide();
            }

            function showDeviceInfo(deviceId, deviceType, deviceName) {
                $('#switchbot-status-device-id-display').text(deviceId);
                $('#switchbot-status-device-type-display').text(deviceType);
                $deviceInfo.show();
            }

            // デバイス選択時
            $deviceSelect.change(function() {
                var val = $(this).val();
                if (!val) {
                    $deviceInfo.hide();
                    $('#node-input-deviceId').val('');
                    $('#node-input-deviceType').val('');
                    $('#node-input-deviceName').val('');
                    return;
                }

                var parts = val.split('|');
                var deviceId = parts[0];
                var deviceType = parts[1] || '';
                var deviceName = parts[2] || '';

                $('#node-input-deviceId').val(deviceId);
                $('#node-input-deviceType').val(deviceType);
                $('#node-input-deviceName').val(deviceName);
                showDeviceInfo(deviceId, deviceType, deviceName);
                hideMessage();
            });

            // デバイス取得ボタン
            $('#switchbot-status-refresh').click(function() {
                var accountId = $('#node-input-account').val() || '';
                if (!accountId) {
                    showMessage('先に認証情報を設定してください', true);
                    return;
                }

                showMessage('デバイス一覧を取得中...', false);
                var adminRoot = (RED.settings.httpAdminRoot || '').replace(/\/$/, '');

                $.ajax({
                    url: adminRoot + '/switchbot-device-status/devices',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ accountId: accountId }),
                    success: function(json) {
                        if (!json.ok) {
                            showMessage(json.message || '取得に失敗しました', true);
                            return;
                        }

                        $deviceSelect.empty().append('<option value="">(デバイスを選択)</option>');
                        deviceCache = json.devices || [];

                        if (deviceCache.length === 0) {
                            showMessage('デバイスが見つかりませんでした', true);
                            return;
                        }

                        deviceCache.forEach(function(d) {
                            var label = d.deviceName + ' (' + d.deviceType + ')';
                            var val = d.deviceId + '|' + d.deviceType + '|' + d.deviceName;
                            $deviceSelect.append($('<option>').val(val).text(label));
                        });

                        showMessage(deviceCache.length + ' 件のデバイスを取得しました', false);
                        setTimeout(hideMessage, 2000);

                        // 既存の選択を復元
                        if (node.deviceId) {
                            var match = deviceCache.find(function(d) { return d.deviceId === node.deviceId; });
                            if (match) {
                                var val = match.deviceId + '|' + match.deviceType + '|' + match.deviceName;
                                $deviceSelect.val(val).trigger('change');
                            }
                        }
                    },
                    error: function(xhr, status, err) {
                        showMessage('エラー: ' + (err || status || 'unknown'), true);
                    }
                });
            });

            // 初期化: 既存値がある場合は表示
            if (node.deviceId) {
                var displayName = node.deviceName || node.deviceId.substring(0, 8) + '...';
                var displayType = node.deviceType || '-';
                showDeviceInfo(node.deviceId, displayType, displayName);
                
                // セレクトにも仮の選択肢を追加
                var val = node.deviceId + '|' + node.deviceType + '|' + node.deviceName;
                $deviceSelect.append($('<option>').val(val)
                    .text('(保存済み: ' + displayName + ')').prop('selected', true));
            }
        },
        oneditsave: function() {
            this.deviceType = $('#node-input-deviceType').val() || '';
            this.deviceName = $('#node-input-deviceName').val() || '';
        }
    });
})();
</script>
