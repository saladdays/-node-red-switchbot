<script type="text/x-red" data-template-name="switchbot-credentials">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> 名前</label>
        <input type="text" id="node-config-input-name" placeholder="マイアカウント">
    </div>
    <div class="form-row">
        <label for="node-config-input-token"><i class="fa fa-key"></i> Token</label>
        <input type="text" id="node-config-input-token" placeholder="SwitchBot API Token">
    </div>
    <div class="form-row">
        <label for="node-config-input-secret"><i class="fa fa-lock"></i> Secret</label>
        <input type="password" id="node-config-input-secret" placeholder="SwitchBot API Secret">
    </div>
</script>

<script type="text/x-red" data-help-name="switchbot-credentials">
    <p>SwitchBot API の認証情報（Token / Secret）を保持するConfig Nodeです。</p>
    <p>複数のSwitchBotノードで共有して使用できます。</p>
    <h3>設定方法</h3>
    <ol>
        <li>SwitchBotアプリを開く</li>
        <li>プロフィール → 設定 → アプリバージョンを数回タップ → 開発者向けオプション</li>
        <li>Token と Secret をコピーして入力</li>
    </ol>
</script>

<script type="text/javascript">
    RED.nodes.registerType('switchbot-credentials', {
        category: 'config',
        defaults: {
            name: { value: '' }
        },
        credentials: {
            token: { type: 'text' },
            secret: { type: 'password' }
        },
        label: function () {
            return this.name || 'SwitchBot API';
        }
    });
</script>
