<script type="text/html" data-template-name="switchbot-credentials">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="My Account">
    </div>
    <div class="form-row">
        <label for="node-config-input-token"><i class="fa fa-key"></i> Token</label>
        <input type="text" id="node-config-input-token" placeholder="SwitchBot API Token">
    </div>
    <div class="form-row">
        <label for="node-config-input-secret"><i class="fa fa-lock"></i> Secret</label>
        <input type="password" id="node-config-input-secret" placeholder="SwitchBot API Secret">
    </div>
</script>

<script type="text/html" data-help-name="switchbot-credentials">
    <p>Config node to store SwitchBot API credentials (Token / Secret).</p>
    <p>Shared across multiple SwitchBot nodes.</p>
    <h3>How to get credentials</h3>
    <ol>
        <li>Open SwitchBot app</li>
        <li>Profile → Preferences → Tap App Version several times → Developer Options</li>
        <li>Copy Token and Secret</li>
    </ol>
</script>

<script type="text/javascript">
    RED.nodes.registerType('switchbot-credentials', {
        category: 'config',
        defaults: {
            name: { value: '' }
        },
        credentials: {
            token: { type: 'text' },
            secret: { type: 'password' }
        },
        label: function () {
            return this.name || 'SwitchBot API';
        }
    });
</script>
